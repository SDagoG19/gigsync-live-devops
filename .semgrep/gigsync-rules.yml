# ======================================================================================
# Reglas SAST propias de GigSync Live (Semgrep)
# Se suman a los paquetes del registro p/owasp-top-ten y p/expressjs en el pipeline.
# Motivo: con el motor gratuito (OSS) esos paquetes no detectan inyección SQL ni de
# comandos en un servidor Node con el módulo http nativo como src/server.js.
# Cualquier hallazgo hace fallar el pipeline (semgrep scan --error).
# ======================================================================================
rules:
  - id: gigsync-sql-string-concatenation
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Consulta SQL construida concatenando o interpolando valores (riesgo de inyección SQL,
      OWASP A03:2021). Usar consultas parametrizadas: db.execute('... WHERE id = ?', [id]).
    metadata:
      owasp: 'A03:2021 - Injection'
      cwe: 'CWE-89: SQL Injection'
    patterns:
      - pattern-either:
          - pattern: $DB.$METHOD("..." + $VALUE, ...)
          - pattern: $DB.$METHOD($VALUE + "...", ...)
          - pattern: $DB.$METHOD(`...${$VALUE}...`, ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(query|execute)$

  - id: gigsync-os-command-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Comando del sistema operativo construido con datos dinámicos (riesgo de inyección de
      comandos, OWASP A03:2021). Usar execFile/spawn con una lista de argumentos fija.
    metadata:
      owasp: 'A03:2021 - Injection'
      cwe: 'CWE-78: OS Command Injection'
    pattern-either:
      # Módulo completo: const cp = require('child_process'); cp.exec(cmd)
      # ($CP une el receptor con el módulo importado, así /regex/.exec(texto) no se marca)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $CP = require("$MODULE");
                  ...
              - pattern-inside: |
                  import $CP from "$MODULE";
                  ...
              - pattern-inside: |
                  import * as $CP from "$MODULE";
                  ...
          - metavariable-regex:
              metavariable: $MODULE
              regex: ^(node:)?child_process$
          - pattern-either:
              - pattern: $CP.exec($CMD, ...)
              - pattern: $CP.execSync($CMD, ...)
          - pattern-not: $CP.exec("...", ...)
          - pattern-not: $CP.execSync("...", ...)
      # Funciones importadas: const { exec } = require('child_process'); exec(cmd)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $IMPORTED = require("$MODULE");
                  ...
              - pattern-inside: |
                  import { $FN } from "$MODULE";
                  ...
          - metavariable-regex:
              metavariable: $MODULE
              regex: ^(node:)?child_process$
          - pattern-either:
              - pattern: exec($CMD, ...)
              - pattern: execSync($CMD, ...)
          - pattern-not: exec("...", ...)
          - pattern-not: execSync("...", ...)

  - id: gigsync-dynamic-code-execution
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Ejecución dinámica de código (eval / new Function / timers con string). Permite
      inyección de código (OWASP A03:2021). Eliminar o reemplazar por lógica explícita.
    metadata:
      owasp: 'A03:2021 - Injection'
      cwe: 'CWE-95: Eval Injection'
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
      - pattern: setTimeout("...", ...)
      - pattern: setInterval("...", ...)
