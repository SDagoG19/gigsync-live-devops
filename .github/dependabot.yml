# Dependabot: propone Pull Requests semanales para mantener al día
#  - las GitHub Actions (que están fijadas por SHA en .github/workflows/ci-cd.yml)
#  - las dependencias npm (package.json / package-lock.json)
# cooldown: espera 7 días antes de proponer una versión recién publicada (protege contra
# paquetes comprometidos que se retiran a las pocas horas o días).
# Cada PR pasa por el mismo pipeline (Gitleaks, SAST, Dependency-Check, pruebas) antes de integrarse.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
